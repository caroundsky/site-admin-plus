<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>报表中心</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: -apple-system, 'Microsoft YaHei', sans-serif;
        color: #303133;
        background: #f5f7fa;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      p.sub {
        margin: 0 0 24px;
        font-size: 13px;
        color: #909399;
      }
      ul {
        max-width: 520px;
        padding: 16px 24px;
        margin: 0;
        list-style: none;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgb(0 0 0 / 6%);
      }
      li {
        padding: 10px 0;
        font-size: 13px;
        border-bottom: 1px solid #ebeef5;
      }
      li:last-child {
        border-bottom: none;
      }
      li span {
        float: right;
        color: #0070b2;
      }
    </style>
  </head>
  <body>
    <h1>报表中心</h1>
    <p class="sub">
      这是 demo/public/pages/reports.html，由站点容器以 iframe 加载
    </p>
    <ul>
      <li>销售日报 <span>已生成</span></li>
      <li>库存周转月报 <span>已生成</span></li>
      <li>客户复购分析 <span>生成中…</span></li>
      <li>渠道 ROI 对比 <span>已生成</span></li>
    </ul>
  </body>
</html>
