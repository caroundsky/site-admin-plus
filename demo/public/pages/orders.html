<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>订单管理</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: -apple-system, 'Microsoft YaHei', sans-serif;
        color: #303133;
        background: #f5f7fa;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      p.sub {
        margin: 0 0 24px;
        font-size: 13px;
        color: #909399;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 1px 4px rgb(0 0 0 / 6%);
      }
      th,
      td {
        padding: 10px 14px;
        font-size: 13px;
        text-align: left;
        border-bottom: 1px solid #ebeef5;
      }
      th {
        background: #fafafa;
        font-weight: 600;
      }
      tr:last-child td {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <h1>订单管理</h1>
    <p class="sub">
      这是 demo/public/pages/orders.html，由站点容器以 iframe 加载
    </p>
    <table>
      <thead>
        <tr>
          <th>订单号</th>
          <th>客户</th>
          <th>金额</th>
          <th>状态</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>SO-20260922-001</td><td>张三</td><td>¥ 1,280.00</td><td>已发货</td></tr>
        <tr><td>SO-20260922-002</td><td>李四</td><td>¥ 460.00</td><td>待付款</td></tr>
        <tr><td>SO-20260922-003</td><td>王五</td><td>¥ 2,150.00</td><td>已完成</td></tr>
        <tr><td>SO-20260922-004</td><td>赵六</td><td>¥ 320.00</td><td>已取消</td></tr>
      </tbody>
    </table>
  </body>
</html>
