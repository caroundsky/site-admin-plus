<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>用户权限</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: -apple-system, 'Microsoft YaHei', sans-serif;
        color: #303133;
        background: #f5f7fa;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      p.sub {
        margin: 0 0 24px;
        font-size: 13px;
        color: #909399;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 1px 4px rgb(0 0 0 / 6%);
      }
      th,
      td {
        padding: 10px 14px;
        font-size: 13px;
        text-align: left;
        border-bottom: 1px solid #ebeef5;
      }
      th {
        background: #fafafa;
        font-weight: 600;
      }
      tr:last-child td {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <h1>用户权限</h1>
    <p class="sub">
      这是 demo/public/pages/users.html，由站点容器以 iframe 加载
    </p>
    <table>
      <thead>
        <tr>
          <th>用户</th>
          <th>角色</th>
          <th>可访问模块</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>admin</td><td>超级管理员</td><td>全部</td></tr>
        <tr><td>张三</td><td>运营</td><td>数据看板 / 交易管理</td></tr>
        <tr><td>李四</td><td>财务</td><td>报表中心</td></tr>
      </tbody>
    </table>
  </body>
</html>
