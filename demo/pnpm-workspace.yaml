# 本机（Windows 未开启开发者模式）无符号链接权限，使用 hoisted 模式避免 EPERM
nodeLinker: hoisted
allowBuilds:
  # sass 的可选依赖，不跑构建脚本也能用（demo 构建已验证），置 false 以免 pnpm 反复提示
  '@parcel/watcher': false
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@caroundsky/lemon-admin@1.0.0-alpha.3 || 1.0.0-alpha.4 || 1.0.0-alpha.5'
